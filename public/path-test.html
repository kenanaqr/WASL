<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logo Path Tester</title>
  <style>
    body { background: #f7f5f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .container { position: relative; width: 353px; height: 234px; border: 1px solid #ccc; }
    img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.5; }
    svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; }
    path { fill: none; stroke: red; stroke-width: 2; opacity: 0.8; }
    .sand-path { stroke: blue; }
  </style>
</head>
<body>
  <div class="container">
    <img src="/src/assets/WASL logo.png" alt="logo">
    <svg viewBox="0 0 353 234" id="mysvg">
      <!-- Petrol Path -->
      <path class="petrol-path" d="M 40,200 C -20,100 120,40 176,117 C 220,180 320,200 320,40" />
      
      <!-- Sand Path -->
      <path class="sand-path" d="M 320,200 C 350,100 220,40 176,117 C 120,180 0,200 40,40" />
    </svg>
  </div>
</body>
</html>
